spring.application.name=e-commerce

# Import .env file
spring.config.import=optional:file:.env[.properties]

# K?t n?i Database PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${SERVER_PORT:8080}


spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:noreply@yourshop.com}

# Application Base URL
app.base-url=${APP_BASE_URL:http://localhost:8080}

# SePay Configuration
sepay.webhook.secret=${SEPAY_WEBHOOK_SECRET}
sepay.bank.account=${SEPAY_BANK_ACCOUNT}
sepay.bank.name=${SEPAY_BANK_NAME:MB Bank}
sepay.account.name=${SEPAY_ACCOUNT_NAME}

# Admin API Key for protected endpoints
admin.api.key=${ADMIN_API_KEY}

# ─── JWT ──────────────────────────────────────────────────────────────────────
